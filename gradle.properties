// Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
// Loom включит обфускацию автоматически:

org.gradle.configuration-cache=false

// Fabric Properties
// Версии стека для Minecraft 1.21.11 (проверены на момент разработки)
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.19.5
loom_version=1.18.2

// Mod Properties
mod_version=2.0
mod_id=dopes_seamless_loading_screen
maven_group=dopes.seamlessloading
archives_base_name=dopes-seamless-loading-screen

// Версии Minecraft, под которые собирается этот jar. Можно перечислить несколько через запятую —
// тогда все они попадут в имя файла: dopes-seamless-loading-screen-2.0+1.21.9-1.21.11.jar.
// Это позволяет держать сборки под разные версии рядом, не переименовывая их вручную.
minecraft_versions=1.21.11

// Dependencies
fabric_version=0.141.6+1.21.11
yacl_version=3.8.2+1.21.11-fabric
modmenu_version=17.0.1

