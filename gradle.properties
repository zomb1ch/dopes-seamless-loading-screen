// Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
// Loom включит обфускацию автоматически:

org.gradle.configuration-cache=false

// Fabric Properties
// Версии стека для Minecraft 1.21.11 (проверены на момент разработки)
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.19.5
loom_version=1.18.2

// Mod Properties
mod_version=2.1
mod_id=dopes_seamless_loading_screen
maven_group=dopes.seamlessloading
archives_base_name=dopes-seamless-loading-screen

// Версии Minecraft, под которые собирается этот jar (через запятую). Сборка идёт против ПОСЛЕДНЕЙ
// версии из списка, а в имя файла и в зависимость minecraft попадает весь диапазон:
// dopes-seamless-loading-screen-2.1+1.21.9-1.21.11.jar
// Fabric Loader сохраняет промежуточные (intermediary) имена между версиями, поэтому один jar
// работает и на более старых версиях из списка.
//
// Нижняя граница 1.21.9: ниже нет LevelLoadTracker, ARGB, RenderPipelines и
// Minecraft#disconnectFromWorld — там нужен другой код. Подробности: docs/VERSIONS.md.
minecraft_versions=1.21.9,1.21.10,1.21.11

// Dependencies
yacl_version=3.8.2+1.21.11-fabric
modmenu_version=17.0.1

