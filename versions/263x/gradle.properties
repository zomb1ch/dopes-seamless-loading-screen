org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=false

// Minecraft 26.x поставляется НЕОБФУСЦИРОВАННЫМ, поэтому здесь используется вариант Loom без
// remapping (net.fabricmc.fabric-loom) и маппинги не запрашиваются: имена классов в игре уже
// официальные. Jar из этого проекта не совместим с 1.21.x (там intermediary) и наоборот.
// Версии Minecraft 26.x, под которые собирается этот jar. 26.2 и 26.3 — одна линия API
// (проверено компиляцией против обеих). 26.1 — отдельная линия, для неё есть versions/26x.
minecraft_version=26.2
minecraft_versions=26.2,26.3
loader_version=0.19.5
loom_version=1.18.3

// Mod Properties
mod_version=2.0
mod_id=dopes_seamless_loading_screen
maven_group=dopes.seamlessloading
archives_base_name=dopes-seamless-loading-screen

// Dependencies (у каждой версии 26.x свои сборки YACL/ModMenu; сборка идёт против самой старой)
yacl_version=3.9.7+26.1-fabric
modmenu_version=18.0.2
